---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned to a commit: a mutable tag on a third-party action can be
      # repointed at arbitrary code after review.
      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          cache: true

      - name: Run format check
        run: pnpm run format:check

      - name: Run lint check
        run: pnpm run lint

      - name: Run stylelint
        run: pnpm run stylelint

      - name: Run type check
        run: pnpm run typecheck

      - name: Build project
        run: pnpm run build
