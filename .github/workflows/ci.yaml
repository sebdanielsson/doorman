---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned to a commit: a mutable tag on a third-party action can be
      # repointed at arbitrary code after review.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true

      - name: Run format check
        run: pnpm run format:check

      - name: Run lint check
        run: pnpm run lint

      - name: Run stylelint
        run: pnpm run stylelint

      - name: Run type check
        run: pnpm run typecheck

      - name: Build project
        run: pnpm run build
